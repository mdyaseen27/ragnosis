# RAGnosis production stack (single VM). MongoDB Atlas is external (see MONGO_URI).
# Usage: docker compose --env-file ../backend/.env -f docker-compose.yml up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../backend/.env
    environment:
      APP_ENV: production
    volumes:
      - uploads:/srv/app/uploads
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uploads:
