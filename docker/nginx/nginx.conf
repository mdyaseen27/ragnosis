# Reverse proxy: terminates HTTP, forwards to gunicorn. TLS terminates here
# in real deployments (certbot) — kept HTTP-only for the viva VM.
events {}

http {
    gzip on;
    gzip_types application/json;

    # Extra hardening on top of the app's own headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;

        # Report uploads: matches MAX_UPLOAD_MB=15
        client_max_body_size 15m;
        client_body_timeout 60s;

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"API only."}}';
            add_header Content-Type application/json;
        }
    }
}
